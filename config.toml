# baseURL = "https://if001.github.io/if-blog-hugo/"
baseURL = "https://www.if-blog.site"

locale = "ja"
title = "アンドロイドは推理小説を書くか?"
theme = "ifblog"

DefaultContentLanguage = "ja"
enableInlineShortcodes = true
footnoteReturnLinkContents = "^"
publishDir= "docs"
pluralizeListTitles = false
ignoreFiles = ["/posts/*/\\.#*"]
enableRobotsTXT = true

[taxonomies]
  tag = "tags"

[services]
  [services.googleAnalytics]
    id="UA-127416809-1"

[params.author]
  name = "if_004"
  discription = "自然言語処理を中心に技術系の記事を書いていきます。"
  language = ["Python", "Go", "TypeScript", "Emacs Lisp"]

[params]
  description="自然言語処理を中心に技術系の記事を書いていきます。"
  since = 2018

[params.about]
  role = "Natural Language Processing / Software Engineer"
  focus = "自然言語処理 / LLM"
  tools = ["Emacs", "Hugo"]
  quote = "アンドロイドは、推理小説を書くか。"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]

[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = true
    hl_Lines = ""
    lineAnchors = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = false
    style = "monokai"
    tabWidth = 4

hasCJKLanguage = true

[blackfriday]
   hrefTargetBlank = true

[[params.nav]]
  identifier = "home"
  name = "Home"
  icon = "fas fa-home fa-lg"
  url = "/"
  weight = 3

[[params.nav]]
  identifier = "about"
  name = "About"
  icon = "fas fa-user fa-lg"
  url = "pages/about"
  weight = 3

[[params.nav]]
  identifier = "tags"
  name = "Tags"
  icon = "fas fa-tag fa-lg"
  url = "tags"
  weight = 3

[[params.nav]]
  identifier = "search"
  name = "Search"
  icon = "fas fa-search fa-lg"
  url = "pages/search"
  weight = 3

[[params.social]]
  name= "twitter"
  url="https://twitter.com/if_004"
  icon="fab fa-twitter"

[related]
  includeNewer = true
  threshold = 20
  toLower = true

[[related.indices]]
  name = "tags"
  weight = 100

[[related.indices]]
  name = "date"
  weight = 10

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

# [params]
#  customCSS = ["/css/custom.css"]
